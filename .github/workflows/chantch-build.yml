# Generated by make_workflow.py (CHANTCH Remote overlay). Runs when the prepare job pushes this build branch.
name: CHANTCH Remote build 1.5.0-chantch.1

on:
  push:
    branches: ["build/**"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "1.5.0-chantch.1"

  rename-assets:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Rename rustdesk-* assets to CHANTCHRemote-* and add SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: "1.5.0-chantch.1"
        run: |
          set -euo pipefail
          mkdir dl
          gh release view "$TAG" --json assets --jq '.assets[].name' > names.txt
          grep -E '^rustdesk-.*\.(exe|msi|dmg)$' names.txt > old.txt || { echo "no rustdesk-* assets on $TAG"; exit 1; }
          while read -r n; do
            new="CHANTCHRemote-${n#rustdesk-}"
            gh release download "$TAG" -p "$n" -D dl
            mv "dl/$n" "dl/$new"
          done < old.txt
          (cd dl && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release upload "$TAG" dl/* --clobber
          while read -r n; do gh release delete-asset "$TAG" "$n" -y; done < old.txt
          grep -q '\.exe$' old.txt && grep -q '\.dmg$' old.txt || { echo "missing Windows or macOS build"; exit 1; }
